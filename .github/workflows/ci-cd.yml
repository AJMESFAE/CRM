# Mismo esquema que la tienda de la fundación y VillaDelCasar: se prepara el
# paquete en GitHub (scripts/build-package.sh: dependencias + pruebas) y se sube
# ya listo a la Web App, que solo tiene que arrancarlo con startup.sh.
#
# El acceso a Azure es por OIDC (sin contraseñas): las variables AZURE_* las
# crea infra/deploy.sh (o se copian de su resumen final). Mientras no existan,
# el workflow solo ejecuta las pruebas.

name: Build and deploy Node.js app to Azure Web App - CRM escolar

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  validar-infra:
    name: Validar infraestructura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep (lint + build)
        run: |
          az bicep install
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Scripts de despliegue (shellcheck)
        run: shellcheck -S warning infra/*.sh scripts/*.sh startup.sh

  build:
    needs: [test, validar-infra]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Probar y empaquetar
        run: scripts/build-package.sh crm.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: crm.zip
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    # Nunca dos despliegues a la vez sobre la misma Web App (Kudu rechaza el segundo).
    concurrency:
      group: deploy-crm-colegio
      cancel-in-progress: false
    permissions:
      id-token: write # Necesario para pedir el token OIDC
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: crm.zip
          clean: true

      - name: Comprobar que el CRM responde
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "${{ steps.deploy-to-webapp.outputs.webapp-url }}/healthz"
